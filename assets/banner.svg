<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="300" fill="url(#grid)" rx="16" />

  <!-- Animated Background Orbs (CSS Keyframe Animations) -->
  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
      50% { transform: translate(30px, -20px) scale(1.15); opacity: 0.7; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-40px, 25px) scale(1.2); opacity: 0.6; }
    }
    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    .orb1 { animation: pulseOrb1 8s ease-in-out infinite; }
    .orb2 { animation: pulseOrb2 10s ease-in-out infinite; }
    .wave { animation: floatWave 6s ease-in-out infinite; }
    .dashed-line { stroke-dasharray: 10, 15; animation: dashCycle 4s linear infinite; }
  </style>

  <circle cx="150" cy="80" r="140" fill="#3b82f6" filter="url(#glow)" class="orb1" />
  <circle cx="1050" cy="220" r="160" fill="#a855f7" filter="url(#glow)" class="orb2" />

  <!-- Dynamic Animated Graphic Elements (Decorations behind text) -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" fill="none" class="dashed-line">
    <path d="M -50,220 Q 300,100 600,220 T 1250,150" />
    <path d="M -50,80 Q 400,260 800,80 T 1250,200" />
  </g>

  <!-- Foreground Content Block -->
  <g class="wave">
    <!-- Icon / Graphic Symbol -->
    <g transform="translate(100, 90)">
      <rect x="0" y="0" width="80" height="100" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="url(#textGrad)" stroke-width="2.5" />
      <path d="M 20 30 L 60 30 M 20 50 L 60 50 M 20 70 L 45 70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <circle cx="55" cy="70" r="8" fill="#10b981" />
      <path d="M 51 70 L 54 73 L 59 67" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Main Header & Subtitle -->
    <text x="210" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="1.5">
      Awesome Assessment Platform
    </text>

    <text x="210" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#e2e8f0" letter-spacing="0.5">
      Curated List of SaaS Products, Open-Source Testing Engines &amp; Proctoring Solutions
    </text>

    <!-- Pills / Tags in Banner -->
    <g transform="translate(210, 200)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="65" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Online Exams</text>

      <rect x="142" y="0" width="140" height="28" rx="14" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
      <text x="212" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">AI Proctoring</text>

      <rect x="294" y="0" width="150" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="369" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">QTI / LTI Standards</text>
    </g>
  </g>
</svg>
